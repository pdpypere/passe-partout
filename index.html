<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passe-partout</title>
<meta name="description" content="Zet foto's zonder bijsnijden om naar Instagram-formaat (4:5), met witte randen waar nodig. Werkt offline, foto's verlaten je toestel niet.">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Passe-partout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: one narrow column, phone-first. A "mat" (passe-partout) is the visual motif: photos sit on a white board. */
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --ink: #1d1f22;
  --muted: #6b6e73;
  --line: #e2e2dc;
  --accent: #2f5d50;
  --accent-ink: #ffffff;
  --chip: #ebebe5;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a; --surface: #202227; --ink: #ececea; --muted: #9a9ca1;
    --line: #2f3137; --accent: #7fb8a6; --accent-ink: #10201b; --chip: #2a2c31;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: grid; gap: 20px;
}
header { display: grid; gap: 4px; }
h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }

.pick {
  display: grid; place-items: center; gap: 6px; text-align: center;
  padding: 28px 16px; border: 2px dashed var(--line); border-radius: 18px;
  background: var(--surface); cursor: pointer;
}
.pick:hover, .pick:focus-within { border-color: var(--accent); }
.pick strong { font-size: 1.1rem; }
.pick span { color: var(--muted); font-size: .9rem; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.btn-main {
  display: inline-block; background: var(--accent); color: var(--accent-ink);
  padding: 12px 22px; border-radius: 999px; font-weight: 600;
}

fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
legend { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip label {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px;
  background: var(--chip); font-size: .95rem; cursor: pointer; border: 1.5px solid transparent;
}
.chip input:checked + label { border-color: var(--accent); background: var(--surface); font-weight: 600; }
.chip input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); }
.ratio { display: inline-block; border: 1.5px solid currentColor; border-radius: 2px; }
.range { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3ch; text-align: right; }
.pick .btn-main { color: var(--accent-ink); font-size: 1.05rem; }
.chip label input[type=color] { position: static; opacity: 1; inset: auto; width: 22px; height: 22px; border: 0; padding: 0; background: none; border-radius: 50%; overflow: hidden; cursor: pointer; }

.settings { display: grid; gap: 18px; background: var(--surface); border-radius: 18px; padding: 18px; }

.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { display: grid; gap: 8px; min-width: 0; }
.card .frame { background: var(--chip); border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
.card img { display: block; width: 100%; height: auto; }
.card .meta { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.card .save { justify-self: start; }
.card img.pickable { cursor: crosshair; }
.pal { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
.dot.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
.dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ghost {
  font: inherit; font-size: .9rem; background: none; color: var(--accent); border: 1.5px solid var(--accent);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.ghost:focus-visible, .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); text-align: center; font-size: .95rem; margin: 0; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.cta {
  flex: 1; font: inherit; font-weight: 600; font-size: 1.05rem; border: 0; border-radius: 999px; padding: 14px 18px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.cta:disabled { opacity: .45; cursor: default; }
.count { font-size: .9rem; color: var(--muted); white-space: nowrap; }
.tip { font-size: .85rem; color: var(--muted); margin: 0; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 9;
}
@media (prefers-reduced-motion: no-preference) { .card { animation: in .25s ease-out both; } }
@keyframes in { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Passe-partout</h1>
    <p class="lead">Foto's naar Instagram-formaat, zonder iets weg te knippen. De foto wordt verkleind en krijgt een rand waar nodig.</p>
  </header>

  <label class="pick" for="files">
    <input id="files" type="file" accept="image/*" multiple>
    <span class="btn-main">Kies foto's</span>
    <span>Eén of meerdere tegelijk. Alles gebeurt op je toestel.</span>
  </label>

  <section class="settings" aria-label="Instellingen">
    <fieldset>
      <legend>Formaat</legend>
      <div class="chips">
        <div class="chip"><input type="radio" name="fmt" id="fmt-45" value="1080x1350" checked><label for="fmt-45"><span class="ratio" style="width:12px;height:15px"></span>4:5 staand</label></div>
        <div class="chip"><input type="radio" name="fmt" id="fmt-11" value="1080x1080"><label for="fmt-11"><span class="ratio" style="width:14px;height:14px"></span>1:1 vierkant</label></div>
        <div class="chip"><input type="radio" name="fmt" id="fmt-34" value="1080x1440"><label for="fmt-34"><span class="ratio" style="width:12px;height:16px"></span>3:4</label></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>Rand</legend>
      <div class="chips">
        <div class="chip"><input type="radio" name="bg" id="bg-white" value="#ffffff" checked><label for="bg-white"><span class="swatch" style="background:#fff"></span>Wit</label></div>
        <div class="chip"><input type="radio" name="bg" id="bg-black" value="#000000"><label for="bg-black"><span class="swatch" style="background:#000"></span>Zwart</label></div>
        <div class="chip"><input type="radio" name="bg" id="bg-photo" value="photo"><label for="bg-photo"><span class="swatch" style="background:conic-gradient(#c96f4a,#e2c08d,#5f8a7a,#3c5a7d,#c96f4a)"></span>Kleur uit foto</label></div>
        <div class="chip"><input type="radio" name="bg" id="bg-custom" value="custom"><label for="bg-custom"><input type="color" id="bg-color" value="#f3eee6" aria-label="Eigen kleur">Eigen kleur</label></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>Extra witruimte rondom</legend>
      <div class="range"><input type="range" id="pad" min="0" max="15" step="1" value="0" aria-label="Extra witruimte in procent"><span class="val" id="pad-val">0%</span></div>
    </fieldset>
  </section>

  <section aria-label="Resultaat">
    <div class="results" id="results"></div>
    <p class="empty" id="empty">Nog geen foto's gekozen.</p>
  </section>
  <p class="tip" id="tip"></p>
</main>

<div class="bar"><div class="in">
  <span class="count" id="count">0 foto's</span>
  <button class="cta" id="save-all" disabled>Bewaar alle foto's</button>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = (s) => document.querySelector(s);
const state = { items: [] }; // { file, name, img, blob, url, info }
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function settings() {
  const [w, h] = document.querySelector('input[name=fmt]:checked').value.split('x').map(Number);
  let bg = document.querySelector('input[name=bg]:checked').value;
  if (bg === 'custom') bg = $('#bg-color').value;
  return { w, h, bg, pad: Number($('#pad').value) / 100 };
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => resolve(img); // browsers apply EXIF orientation for <img>
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Kan dit bestand niet openen')); };
    img.src = url;
  });
}

// Downscale in halving steps for a sharper result than one big jump.
function drawScaled(ctx, img, dx, dy, dw, dh) {
  let src = img, sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  while (sw / 2 > dw && sh / 2 > dh) {
    const c = document.createElement('canvas');
    c.width = Math.round(sw / 2); c.height = Math.round(sh / 2);
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(src, 0, 0, c.width, c.height);
    src = c; sw = c.width; sh = c.height;
  }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, dx, dy, dw, dh);
}

// Small copy of the photo, used for the palette and for tap-to-pick.
function makeSample(img) {
  const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.min(1, 400 / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(iw * s)); c.height = Math.max(1, Math.round(ih * s));
  const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high';
  x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');

// Dominant colours: bucket pixels, keep the 5 biggest buckets that differ enough.
function palette(sample) {
  const d = sample.getContext('2d').getImageData(0, 0, sample.width, sample.height).data;
  const buckets = new Map();
  const step = Math.max(1, Math.floor(d.length / 4 / 20000));
  for (let i = 0; i < d.length; i += 4 * step) {
    const k = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4);
    const b = buckets.get(k) || { n: 0, r: 0, g: 0, b: 0 };
    b.n++; b.r += d[i]; b.g += d[i + 1]; b.b += d[i + 2]; buckets.set(k, b);
  }
  const sorted = [...buckets.values()].sort((a, b) => b.n - a.n).map((b) => [b.r / b.n, b.g / b.n, b.b / b.n]);
  const out = [];
  for (const c of sorted) {
    if (out.every((o) => Math.hypot(o[0] - c[0], o[1] - c[1], o[2] - c[2]) > 48)) out.push(c);
    if (out.length === 5) break;
  }
  return out.map((c) => hex(...c));
}

function pickAt(item, fx, fy) {
  // fx, fy: 0..1 position on the result image. Map back to the photo.
  const p = item.place; if (!p) return null;
  const px = (fx * p.W - p.dx) / p.dw, py = (fy * p.H - p.dy) / p.dh;
  if (px < 0 || py < 0 || px > 1 || py > 1) return null;
  const s = item.sample, x = Math.min(s.width - 1, Math.floor(px * s.width)), y = Math.min(s.height - 1, Math.floor(py * s.height));
  // average a 3x3 patch so a single noisy pixel doesn't win
  const x0 = Math.max(0, x - 1), y0 = Math.max(0, y - 1);
  const d = s.getContext('2d').getImageData(x0, y0, Math.min(3, s.width - x0), Math.min(3, s.height - y0)).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  return hex(r / n, g / n, b / n);
}

function describe(iw, ih, W, H) {
  const r = iw / ih, t = W / H;
  if (Math.abs(r - t) < 0.01) return 'Had al het juiste formaat';
  return r > t ? 'Rand boven en onder' : 'Rand links en rechts';
}

async function render(item) {
  const { w: W, h: H, bg, pad } = settings();
  const img = item.img;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  item.fill = bg === 'photo' ? (item.picked || item.colors[0]) : bg;
  ctx.fillStyle = item.fill; ctx.fillRect(0, 0, W, H);
  const boxW = W * (1 - 2 * pad), boxH = H * (1 - 2 * pad);
  const s = Math.min(boxW / iw, boxH / ih);
  const dw = Math.round(iw * s), dh = Math.round(ih * s);
  const dx = Math.round((W - dw) / 2), dy = Math.round((H - dh) / 2);
  drawScaled(ctx, img, dx, dy, dw, dh);
  item.place = { W, H, dx, dy, dw, dh };
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.93));
  if (item.url) URL.revokeObjectURL(item.url);
  item.blob = blob; item.url = URL.createObjectURL(blob);
  item.info = `${describe(iw, ih, W, H)} · ${W}×${H}`;
  item.outName = item.name.replace(/\.[^.]+$/, '') + `_${W}x${H}.jpg`;
}

function card(item, i) {
  const photoMode = settings().bg === 'photo';
  const el = document.createElement('figure');
  el.className = 'card'; el.style.margin = '0';
  el.innerHTML = `<div class="frame"><img alt=""></div><div class="pal" hidden></div><figcaption class="meta"></figcaption><button class="ghost save" type="button">Bewaar</button>`;
  const im = el.querySelector('img');
  im.src = item.url; im.alt = 'Resultaat ' + item.name;
  el.querySelector('.meta').textContent = item.info;
  el.querySelector('.save').addEventListener('click', () => save([item]));
  if (photoMode) {
    const pal = el.querySelector('.pal'); pal.hidden = false;
    const set = (col) => { item.picked = col; busy = busy.then(() => render(item)).then(paint); };
    const colors = [...item.colors];
    if (item.picked && !colors.includes(item.picked)) colors.push(item.picked);
    for (const col of colors) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'dot' + (col === item.fill ? ' on' : '');
      b.style.background = col; b.setAttribute('aria-label', 'Randkleur ' + col);
      b.addEventListener('click', () => set(col));
      pal.appendChild(b);
    }
    im.classList.add('pickable');
    im.addEventListener('click', (e) => {
      const r = im.getBoundingClientRect();
      const col = pickAt(item, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
      if (col) set(col);
    });
  }
  return el;
}

function paint() {
  const box = $('#results'); box.replaceChildren(...state.items.map(card));
  const n = state.items.length;
  $('#empty').hidden = n > 0;
  $('#count').textContent = n === 1 ? '1 foto' : `${n} foto's`;
  $('#save-all').disabled = n === 0;
  $('#save-all').textContent = n > 1 ? `Bewaar alle ${n} foto's` : 'Bewaar foto';
  $('#tip').textContent = n === 0 ? '' : (settings().bg === 'photo' ? 'Tik op een bolletje of rechtstreeks op een plek in de foto om die kleur als rand te gebruiken. ' : '') + (canShareFiles()
    ? (isIOS ? 'Tip: kies in het deelmenu "Bewaar afbeeldingen" om ze in Foto\'s te zetten, of deel meteen naar Instagram.' : 'Tip: in het deelmenu kan je bewaren in je galerij of meteen naar Instagram sturen.')
    : 'De foto\'s worden gedownload naar je toestel.');
}

let busy = Promise.resolve();
function rerenderAll() {
  busy = busy.then(async () => { for (const it of state.items) await render(it); paint(); });
  return busy;
}

$('#files').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  toast(files.length > 1 ? `${files.length} foto's verwerken…` : 'Foto verwerken…');
  busy = busy.then(async () => {
    for (const file of files) {
      try {
        const img = await loadImage(file);
        const sample = makeSample(img);
        const item = { file, name: file.name || 'foto.jpg', img, sample, colors: palette(sample) };
        await render(item);
        state.items.push(item);
        paint();
      } catch (err) { toast(`${file.name}: ${err.message}`); }
    }
    toast(null);
  });
});

document.querySelectorAll('input[name=fmt], input[name=bg]').forEach((r) => r.addEventListener('change', () => { remember(); rerenderAll(); }));
$('#bg-color').addEventListener('input', () => { $('#bg-custom').checked = true; });
$('#bg-color').addEventListener('change', () => { $('#bg-custom').checked = true; remember(); rerenderAll(); });
$('#pad').addEventListener('input', () => { $('#pad-val').textContent = $('#pad').value + '%'; });
$('#pad').addEventListener('change', () => { remember(); rerenderAll(); });

function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/jpeg' })], 't.jpg', { type: 'image/jpeg' })] })); }
  catch { return false; }
}

async function save(items) {
  await busy;
  const files = items.map((it) => new File([it.blob], it.outName, { type: 'image/jpeg' }));
  if (canShareFiles() && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    await new Promise((r) => setTimeout(r, 250));
  }
  toast(files.length > 1 ? `${files.length} foto's bewaard` : 'Foto bewaard');
}
$('#save-all').addEventListener('click', () => save(state.items));

let toastTimer;
function toast(msg) {
  const t = $('#toast'); clearTimeout(toastTimer);
  if (!msg) { t.hidden = true; return; }
  t.textContent = msg; t.hidden = false;
  toastTimer = setTimeout(() => (t.hidden = true), 2600);
}

// Remember last-used settings on this phone.
function remember() {
  try { localStorage.setItem('pp-settings', JSON.stringify({ fmt: document.querySelector('input[name=fmt]:checked').id, bg: document.querySelector('input[name=bg]:checked').id, color: $('#bg-color').value, pad: $('#pad').value })); } catch {}
}
try {
  const s = JSON.parse(localStorage.getItem('pp-settings') || 'null');
  if (s) {
    if (document.getElementById(s.fmt)) document.getElementById(s.fmt).checked = true;
    if (document.getElementById(s.bg)) document.getElementById(s.bg).checked = true;
    if (s.color) $('#bg-color').value = s.color;
    if (s.pad) { $('#pad').value = s.pad; $('#pad-val').textContent = s.pad + '%'; }
  }
} catch {}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
paint();
</script>
</body>
</html>
